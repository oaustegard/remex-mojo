name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  mojo:
    name: mojo tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Mojo is pinned: 1.x does not parse this code yet. remex comes from
      # its main branch so a change there that breaks parity shows up here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mojo==0.26.2.0" "remex @ git+https://github.com/oaustegard/remex@main"

      # The runner has no GPU; without a named accelerator Mojo 0.26.2
      # refuses to compile the GPU kernels the CLI links.
      - name: Build CLI
        run: mojo build --target-accelerator nvidia:80 -I . polarquant.mojo -o polarquant

      - name: Tests
        run: tests/run_all.sh
